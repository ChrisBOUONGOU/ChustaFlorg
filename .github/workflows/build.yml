name: Build ChustaFlorg

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore .\ChustaFlorg\ChustaFlorg.csproj -p:TargetFramework=net10.0-windows10.0.19041.0
      - name: Build Windows app
        run: dotnet build .\ChustaFlorg\ChustaFlorg.csproj -f net10.0-windows10.0.19041.0 --no-restore
